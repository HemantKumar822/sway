# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Parallel project execution and build cache are safe: modules share no outputs.
org.gradle.parallel=true
org.gradle.caching=true

org.gradle.configuration-cache=true

# AndroidX is required; Jetifier stays off (no legacy support-library deps).
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Host JBR is JDK 25; core:model bytecode target is 21 per AR-13. Suppress strict
# toolchain mismatch so fresh clones with JBR 25 still compile to 21 bytecode.
kotlin.jvm.target.validation.mode=WARNING
